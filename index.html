<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important} html,body{margin:0;background:#000}</style>
<title>আকাশ ঘড়ি</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wdth,wght@75..125,100..800&family=Hind+Siliguri:wght@300;400;500&display=swap">
<style>
/* Layout: AMOLED কালো পর্দা। উপরে আকাশ-খিলান (আজকের সূর্য/চাঁদের আসল পথ), মাঝখানে বড় সময়, নিচে আবহাওয়া ও সূর্য-চাঁদের তথ্য। */
:root {
  color-scheme: dark;
  --h: 200;
  --bg: #000;
  --ink: hsl(var(--h) 68% 66%);
  --ink2: hsl(var(--h) 34% 46%);
  --ink3: hsl(var(--h) 24% 30%);
  --panel: #0c0c10;
  --panel-line: #25252d;
  --panel-ink: #cfd2da;
  --panel-dim: #7d8190;
  --display: "Anek Bangla", "Noto Sans Bengali", "Hind Siliguri", sans-serif;
  --body: "Hind Siliguri", "Noto Sans Bengali", sans-serif;
}
html, body { height: 100%; }
body {
  margin: 0; box-sizing: border-box; background: var(--bg); color: var(--ink);
  font-family: var(--body); font-size: 15px; overflow: hidden;
  padding-block: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent; user-select: none;
}
#c { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
#stage { position: relative; z-index: 1; height: 100%; display: flex; flex-direction: column; transition: transform 6s ease-in-out; }
#top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; min-width: 0; color: var(--ink2); font-size: 14px; letter-spacing: .04em; transition: color 6s; }
#sky { flex: 1 1 34%; min-height: 150px; position: relative; margin-top: 10px; margin-bottom: 40px; }
#skyinfo { position: absolute; left: 0; top: 6px; font-size: 13px; letter-spacing: .03em; color: var(--ink2); transition: color 6s; }
#clock { margin-top: 6px; display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 14px; cursor: pointer; padding-top: 2px; }
#digits { min-width: 0; }
.hh, .mm { display: block; font-family: var(--display); font-stretch: 112%; line-height: .86; white-space: nowrap; font-size: clamp(110px, 38vw, 180px); }
.hh { font-weight: 100; color: var(--ink); transition: color 6s; }
.mm { font-weight: 800; letter-spacing: -.01em; color: transparent; background: linear-gradient(180deg, hsl(var(--h) 66% 60%), hsl(calc(var(--h) + 55) 62% 44%)); -webkit-background-clip: text; background-clip: text; }
#clock.speaking .mm { filter: drop-shadow(0 0 14px hsl(var(--h) 80% 55% / .6)); }
#rule { display: flex; align-items: center; gap: 12px; margin: 8px 0 10px; font-size: 15px; letter-spacing: .12em; color: var(--ink2); transition: color 6s; }
#rule::after { content: ""; flex: 1; height: 1px; background: var(--ink3); transition: background 6s; }
#side { display: flex; flex-direction: column; justify-content: space-between; align-items: flex-end; padding: 4px 0 8px; gap: 12px; }
#temp { font-family: var(--display); font-weight: 300; font-stretch: 112%; font-size: 46px; line-height: 1; color: var(--ink); transition: color 6s; }
#cond { writing-mode: vertical-rl; font-size: 17px; letter-spacing: .1em; color: var(--ink2); border-right: 1px solid var(--ink3); padding-right: 9px; transition: color 6s, border-color 6s; }
#gear { position: fixed; z-index: 5; right: max(10px, env(safe-area-inset-right, 0px)); bottom: calc(10px + env(safe-area-inset-bottom, 0px)); width: 38px; height: 38px; border: 0; border-radius: 50%; background: transparent; color: var(--ink3); display: grid; place-items: center; cursor: pointer; }
#gear:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
#sheet { position: fixed; z-index: 9; left: 0; right: 0; bottom: 0; max-height: 78%; overflow-y: auto; box-sizing: border-box; background: var(--panel); color: var(--panel-ink); border-top: 1px solid var(--panel-line); border-radius: 18px 18px 0 0;
  padding-top: 16px; padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#sheet h2 { margin: 0 0 4px; font-family: var(--display); font-size: 20px; font-weight: 500; }
#sheet h3 { margin: 16px 0 8px; font-size: 13px; font-weight: 500; color: var(--panel-dim); letter-spacing: .04em; }
#sheet .row { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font: inherit; font-size: 14px; color: var(--panel-ink); background: #17171d; border: 1px solid var(--panel-line); border-radius: 999px; padding: 7px 14px; cursor: pointer; }
.chip[aria-pressed="true"] { background: hsl(var(--h) 45% 24%); border-color: hsl(var(--h) 50% 44%); color: #fff; }
.sw { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; font-size: 15px; }
.sw input { width: 22px; height: 22px; accent-color: hsl(var(--h) 60% 55%); }
#sim { width: 100%; accent-color: hsl(var(--h) 60% 55%); }
.simline { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 14px; color: var(--panel-dim); }
#status { margin: 8px 0 0; font-size: 13px; color: var(--panel-dim); line-height: 1.5; }
#closeBtn { float: right; }
#toast { position: fixed; z-index: 12; left: 50%; bottom: calc(64px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); max-width: min(86vw, 420px); background: #1b1b22; color: #e6e8ee; border: 1px solid var(--panel-line); border-radius: 12px; padding: 10px 14px; font-size: 14px; line-height: 1.45; text-align: center; }
@media (prefers-reduced-motion: reduce) { #stage, #top, .hh, #rule, #cond { transition: none; } }
</style>

<canvas id="c" aria-hidden="true"></canvas>
<div id="stage">
  <div id="top"><span id="date"></span></div>
  <div id="clock" role="button" tabindex="0" aria-label="সময় শুনতে ট্যাপ করুন">
    <div id="digits">
      <span class="hh" id="hh"></span>
      <div id="rule"><span id="period"></span></div>
      <span class="mm" id="mm"></span>
    </div>
    <div id="side"><div id="temp"></div><div id="cond"></div></div>
  </div>
  <div id="sky"><div id="skyinfo"></div></div>
</div>

<button id="gear" aria-label="সেটিংস" type="button">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
</button>

<div id="sheet" role="dialog" aria-label="সেটিংস" hidden>
  <button class="chip" id="closeBtn" type="button">বন্ধ</button>
  <h2>আকাশ ঘড়ি</h2>
  <p id="status"></p>
  <h3>আবহাওয়া পরীক্ষা করে দেখুন</h3>
  <div class="row" id="wxChips"></div>
  <h3>সময় ঘুরিয়ে সূর্য-চাঁদ দেখুন</h3>
  <input id="sim" type="range" min="0" max="1435" step="5" value="0" aria-label="দিনের সময়">
  <div class="simline"><span id="simLabel"></span><button class="chip" id="simReset" type="button">এখনকার সময়</button></div>
  <h3>কথা ও পর্দা</h3>
  <label class="sw" for="hourly"><span>প্রতি ঘণ্টায় নিজে থেকে বলবে</span><input id="hourly" type="checkbox"></label>
  <label class="sw" for="wake"><span>পর্দা জাগিয়ে রাখো</span><input id="wake" type="checkbox"></label>
  <h3>রঙ বদলের সময়</h3>
  <div class="row" id="hueChips"></div>
  <h3>লোকেশন</h3>
  <div class="row"><button class="chip" id="locBtn" type="button">আমার লোকেশন ব্যবহার করো</button></div>
</div>
<div id="toast" hidden></div>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var BD = "০১২৩৪৫৬৭৮৯";
  var bn = function (s) { return String(s).replace(/\d/g, function (d) { return BD[d]; }); };
  var pad = function (n) { return n < 10 ? "0" + n : "" + n; };
  var clamp = function (v, a, b) { return Math.max(a, Math.min(b, v)); };
  var rnd = Math.random;

  var W = ["শূন্য","এক","দুই","তিন","চার","পাঁচ","ছয়","সাত","আট","নয়","দশ","এগারো","বারো","তেরো","চৌদ্দ","পনেরো","ষোলো","সতেরো","আঠারো","ঊনিশ","বিশ","একুশ","বাইশ","তেইশ","চব্বিশ","পঁচিশ","ছাব্বিশ","সাতাশ","আটাশ","ঊনত্রিশ","ত্রিশ","একত্রিশ","বত্রিশ","তেত্রিশ","চৌত্রিশ","পঁয়ত্রিশ","ছত্রিশ","সাঁইত্রিশ","আটত্রিশ","ঊনচল্লিশ","চল্লিশ","একচল্লিশ","বিয়াল্লিশ","তেতাল্লিশ","চুয়াল্লিশ","পঁয়তাল্লিশ","ছেচল্লিশ","সাতচল্লিশ","আটচল্লিশ","ঊনপঞ্চাশ","পঞ্চাশ","একান্ন","বাহান্ন","তিপ্পান্ন","চুয়ান্ন","পঞ্চান্ন","ছাপ্পান্ন","সাতান্ন","আটান্ন","ঊনষাট","ষাট"];
  var H12 = ["বারোটা","একটা","দুইটা","তিনটা","চারটা","পাঁচটা","ছয়টা","সাতটা","আটটা","নয়টা","দশটা","এগারোটা"];
  var DAYS = ["রবিবার","সোমবার","মঙ্গলবার","বুধবার","বৃহস্পতিবার","শুক্রবার","শনিবার"];
  var MONTHS = ["জানুয়ারি","ফেব্রুয়ারি","মার্চ","এপ্রিল","মে","জুন","জুলাই","আগস্ট","সেপ্টেম্বর","অক্টোবর","নভেম্বর","ডিসেম্বর"];
  var DIRS = ["উত্তর","উত্তর-পূর্ব","পূর্ব","দক্ষিণ-পূর্ব","দক্ষিণ","দক্ষিণ-পশ্চিম","পশ্চিম","উত্তর-পশ্চিম"];
  var HUES = [200, 28, 160, 330, 265, 95, 48, 8];

  function period(h) {
    if (h >= 4 && h < 6) return "ভোর";
    if (h >= 6 && h < 12) return "সকাল";
    if (h >= 12 && h < 15) return "দুপুর";
    if (h >= 15 && h < 17) return "বিকাল";
    if (h >= 17 && h < 19) return "সন্ধ্যা";
    return "রাত";
  }

  /* ---------- অবস্থা ---------- */
  var S = {
    lat: 23.8103, lon: 90.4125, place: "ঢাকা", located: false,
    wx: { code: 2, temp: 29, feels: 33, hum: 72, wind: 9, cloud: 45, live: false, when: null },
    demo: null, sim: null, hourly: false, wake: false, hueEvery: 120
  };
  try {
    var saved = JSON.parse(localStorage.getItem("akash-ghori") || "{}");
    if (saved.hourly) S.hourly = true;
    if (saved.hueEvery) S.hueEvery = saved.hueEvery;
  } catch (e) {}
  function persist() { try { localStorage.setItem("akash-ghori", JSON.stringify({ hourly: S.hourly, hueEvery: S.hueEvery })); } catch (e) {} }

  function getNow() {
    if (S.sim == null) return new Date();
    var d = new Date(); d.setHours(0, 0, 0, 0); d.setMinutes(S.sim); return d;
  }

  /* ---------- জ্যোতির্বিজ্ঞান ---------- */
  var RAD = Math.PI / 180, DEG = 180 / Math.PI, EPS = 23.4397 * RAD;
  function dayNum(date) { return date.getTime() / 86400000 + 2440587.5 - 2451545; }
  function altaz(d, ra, dec) {
    var th = (280.16 + 360.9856235 * d + S.lon) * RAD, H = th - ra, p = S.lat * RAD;
    var alt = Math.asin(Math.sin(p) * Math.sin(dec) + Math.cos(p) * Math.cos(dec) * Math.cos(H));
    var az = Math.atan2(Math.sin(H), Math.cos(H) * Math.sin(p) - Math.tan(dec) * Math.cos(p));
    return { alt: alt * DEG, az: (az * DEG + 180 + 360) % 360 };
  }
  function sunPos(date) {
    var d = dayNum(date), M = (357.5291 + 0.98560028 * d) * RAD;
    var C = (1.9148 * Math.sin(M) + 0.02 * Math.sin(2 * M) + 0.0003 * Math.sin(3 * M)) * RAD;
    var L = M + C + 102.9372 * RAD + Math.PI;
    var dec = Math.asin(Math.sin(EPS) * Math.sin(L)), ra = Math.atan2(Math.sin(L) * Math.cos(EPS), Math.cos(L));
    var r = altaz(d, ra, dec); r.lon = L; return r;
  }
  function moonPos(date) {
    var d = dayNum(date);
    var L = (218.316 + 13.176396 * d) * RAD, M = (134.963 + 13.064993 * d) * RAD, F = (93.272 + 13.22935 * d) * RAD;
    var l = L + 6.289 * RAD * Math.sin(M), b = 5.128 * RAD * Math.sin(F);
    var ra = Math.atan2(Math.sin(l) * Math.cos(EPS) - Math.tan(b) * Math.sin(EPS), Math.cos(l));
    var dec = Math.asin(Math.sin(b) * Math.cos(EPS) + Math.cos(b) * Math.sin(EPS) * Math.sin(l));
    var r = altaz(d, ra, dec); r.lon = l; return r;
  }
  function moonPhase(date) {
    var delta = (moonPos(date).lon - sunPos(date).lon) % (2 * Math.PI);
    if (delta < 0) delta += 2 * Math.PI;
    return delta;
  }
  function phaseName(delta) {
    var g = delta * DEG;
    if (g < 10 || g >= 350) return "অমাবস্যা";
    if (g < 80) return "শুক্লপক্ষের বাঁকা চাঁদ";
    if (g < 100) return "শুক্লপক্ষের অর্ধচাঁদ";
    if (g < 170) return "শুক্লপক্ষের প্রায় পূর্ণ চাঁদ";
    if (g < 190) return "পূর্ণিমা";
    if (g < 260) return "কৃষ্ণপক্ষের প্রায় পূর্ণ চাঁদ";
    if (g < 280) return "কৃষ্ণপক্ষের অর্ধচাঁদ";
    return "কৃষ্ণপক্ষের বাঁকা চাঁদ";
  }
  function crossings(fn, th, base) {
    var start = new Date(base); start.setHours(0, 0, 0, 0);
    var res = { rise: null, set: null }, prev = fn(start);
    for (var m = 5; m <= 1440; m += 5) {
      var t = new Date(start.getTime() + m * 60000), a = fn(t);
      if (prev < th && a >= th && !res.rise) res.rise = t;
      if (prev >= th && a < th && !res.set) res.set = t;
      prev = a;
    }
    return res;
  }
  function pathPoints(fn, base) {
    var start = new Date(base); start.setHours(0, 0, 0, 0);
    var pts = [];
    for (var m = 0; m <= 1440; m += 10) {
      var r = fn(new Date(start.getTime() + m * 60000));
      if (r.alt > -3) pts.push({ m: m, alt: r.alt, az: r.az });
    }
    return pts;
  }

  var dayCache = { key: "", sunPath: [], moonPath: [], sunEv: {}, moonEv: {}, moonNext: null };
  function ensureDay(n) {
    var key = n.toDateString() + "|" + S.lat.toFixed(2) + "|" + S.lon.toFixed(2);
    if (dayCache.key === key) return;
    var tomorrow = new Date(n.getTime() + 86400000);
    dayCache.key = key;
    dayCache.sunPath = pathPoints(sunPos, n);
    dayCache.moonPath = pathPoints(moonPos, n);
    dayCache.sunEv = crossings(function (t) { return sunPos(t).alt; }, -0.833, n);
    dayCache.moonEv = crossings(function (t) { return moonPos(t).alt; }, 0.125, n);
    dayCache.moonTomorrow = crossings(function (t) { return moonPos(t).alt; }, 0.125, tomorrow);
    dayCache.sunTomorrow = crossings(function (t) { return sunPos(t).alt; }, -0.833, tomorrow);
  }

  /* ---------- আবহাওয়া ---------- */
  function classify(code, cloud) {
    var c = { cond: "clear", label: "পরিষ্কার আকাশ", rain: 0, drizzle: false, cover: cloud };
    if (code === 0 || code === 1) { c.cover = Math.min(cloud, 20); }
    else if (code === 2) { c.cond = "partly"; c.label = "আংশিক মেঘলা"; c.cover = clamp(cloud, 30, 65); }
    else if (code === 3) { c.cond = "cloudy"; c.label = "মেঘলা"; c.cover = Math.max(cloud, 85); }
    else if (code === 45 || code === 48) { c.cond = "fog"; c.label = "কুয়াশা"; c.cover = Math.max(cloud, 40); }
    else if (code >= 51 && code <= 57) { c.cond = "rain"; c.label = "গুঁড়িগুঁড়ি বৃষ্টি"; c.rain = 0.35; c.drizzle = true; c.cover = Math.max(cloud, 85); }
    else if (code === 61 || code === 80 || code === 66) { c.cond = "rain"; c.label = "হালকা বৃষ্টি"; c.rain = 0.55; c.cover = Math.max(cloud, 90); }
    else if (code === 63 || code === 81 || code === 67) { c.cond = "rain"; c.label = "বৃষ্টি"; c.rain = 0.85; c.cover = Math.max(cloud, 92); }
    else if (code === 65 || code === 82) { c.cond = "rain"; c.label = "ভারী বৃষ্টি"; c.rain = 1.15; c.cover = 100; }
    else if (code >= 95) { c.cond = "storm"; c.label = "বজ্রসহ বৃষ্টি"; c.rain = 1.2; c.cover = 100; }
    else if (code >= 71) { c.cond = "cloudy"; c.label = "মেঘলা"; c.cover = Math.max(cloud, 85); }
    return c;
  }
  var DEMOS = [
    { n: "লাইভ", v: null },
    { n: "পরিষ্কার", v: { code: 0, cloud: 5, temp: 31, feels: 34, hum: 55, wind: 8 } },
    { n: "আংশিক মেঘ", v: { code: 2, cloud: 45, temp: 29, feels: 33, hum: 72, wind: 9 } },
    { n: "মেঘলা", v: { code: 3, cloud: 95, temp: 27, feels: 30, hum: 82, wind: 12 } },
    { n: "কুয়াশা", v: { code: 45, cloud: 60, temp: 17, feels: 16, hum: 96, wind: 3 } },
    { n: "গুঁড়ি বৃষ্টি", v: { code: 51, cloud: 90, temp: 26, feels: 29, hum: 90, wind: 10 } },
    { n: "বৃষ্টি", v: { code: 63, cloud: 95, temp: 25, feels: 28, hum: 93, wind: 16 } },
    { n: "ঝড়-বৃষ্টি", v: { code: 95, cloud: 100, temp: 24, feels: 27, hum: 95, wind: 32 } }
  ];
  function curWx() { return S.demo ? S.demo : S.wx; }

  function fetchWx() {
    var url = "https://api.open-meteo.com/v1/forecast?latitude=" + S.lat + "&longitude=" + S.lon +
      "&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,cloud_cover,wind_speed_10m&timezone=auto";
    try {
      fetch(url).then(function (r) { return r.json(); }).then(function (j) {
        var c = j.current;
        S.wx = { code: c.weather_code, temp: Math.round(c.temperature_2m), feels: Math.round(c.apparent_temperature),
          hum: Math.round(c.relative_humidity_2m), wind: Math.round(c.wind_speed_10m), cloud: Math.round(c.cloud_cover),
          live: true, when: new Date() };
        refreshStatus(); tick(true);
      }).catch(function () { refreshStatus(); });
    } catch (e) { refreshStatus(); }

    }, function () { toast("লোকেশন অনুমতি পাওয়া যায়নি। ঢাকার হিসাব চলছে।"); }, { timeout: 9000, maximumAge: 3600000 });
  });
  document.addEventListener("visibilitychange", function () { if (!document.hidden && S.wake) setWake(true); });
  window.addEventListener("resize", resize);
  if ("speechSynthesis" in window) { try { window.speechSynthesis.getVoices(); } catch (e) {} }

  $("hourly").checked = S.hourly;
  buildChips(); simLabel();
  tick(true); resize(); refreshStatus();
  setInterval(tick, 1000);
  setInterval(fetchWx, 15 * 60 * 1000);
  fetchWx();
  requestAnimationFrame(frame);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { setTimeout(resize, 50); });
})();
</script>
