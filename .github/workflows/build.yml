name: Build Akash Ghori APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate Android project
        run: |
          set -e
          mkdir -p app/src/main/java/com/akash/ghori app/src/main/assets
          cat > settings.gradle <<'END_FILE_0'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AkashGhori"
          include ':app'
          END_FILE_0
          cat > build.gradle <<'END_FILE_1'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          END_FILE_1
          cat > gradle.properties <<'END_FILE_2'
          org.gradle.jvmargs=-Xmx2g
          android.suppressUnsupportedCompileSdk=34
          END_FILE_2
          cat > app/build.gradle <<'END_FILE_3'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.akash.ghori'
              compileSdk 34

              defaultConfig {
                  applicationId "com.akash.ghori"
                  minSdk 24
                  targetSdk 33
                  versionCode 1
                  versionName "1.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          END_FILE_3
          cat > app/src/main/AndroidManifest.xml <<'END_FILE_4'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />

              <application
                  android:allowBackup="false"
                  android:label="আকাশ ঘড়ি"
                  android:theme="@android:style/Theme.Black.NoTitleBar.Fullscreen">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:showWhenLocked="true"
                      android:turnScreenOn="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|screenLayout|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".ClockDream"
                      android:exported="true"
                      android:label="আকাশ ঘড়ি"
                      android:permission="android.permission.BIND_DREAM_SERVICE">
                      <intent-filter>
                          <action android:name="android.service.dreams.DreamService" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          END_FILE_4
          cat > app/src/main/java/com/akash/ghori/MainActivity.java <<'END_FILE_5'
          package com.akash.ghori;

          import android.Manifest;
          import android.app.Activity;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.speech.tts.TextToSpeech;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.GeolocationPermissions;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;

          import java.util.Locale;

          public class MainActivity extends Activity {

              private WebView web;
              private TextToSpeech tts;
              private boolean ttsReady = false;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  if (Build.VERSION.SDK_INT >= 27) {
                      setShowWhenLocked(true);
                      setTurnScreenOn(true);
                  } else {
                      getWindow().addFlags(WindowManager.LayoutParams.FLAG_SHOW_WHEN_LOCKED
                              | WindowManager.LayoutParams.FLAG_TURN_SCREEN_ON);
                  }
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);

                  WindowManager.LayoutParams lp = getWindow().getAttributes();
                  lp.screenBrightness = 0.1f;
                  getWindow().setAttributes(lp);
                  hideBars();

                  web = new WebView(this);
                  web.setBackgroundColor(0xFF000000);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setAllowUniversalAccessFromFileURLs(true);
                  s.setGeolocationEnabled(true);
                  web.setWebViewClient(new WebViewClient());
                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onGeolocationPermissionsShowPrompt(String origin, GeolocationPermissions.Callback callback) {
                          callback.invoke(origin, true, false);
                      }
                  });
                  web.addJavascriptInterface(new Bridge(), "Android");
                  setContentView(web);

                  if (Build.VERSION.SDK_INT >= 23
                          && checkSelfPermission(Manifest.permission.ACCESS_COARSE_LOCATION) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{Manifest.permission.ACCESS_COARSE_LOCATION}, 1);
                  }

                  tts = new TextToSpeech(this, status -> {
                      if (status == TextToSpeech.SUCCESS) {
                          int r = tts.setLanguage(new Locale("bn", "BD"));
                          ttsReady = (r != TextToSpeech.LANG_MISSING_DATA && r != TextToSpeech.LANG_NOT_SUPPORTED);
                      }
                  });

                  web.loadUrl("file:///android_asset/index.html");
              }
